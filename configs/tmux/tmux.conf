# ~/.tmux.conf — minimal, sane defaults.

# Use Ctrl-a as prefix (more reachable than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 1-indexed windows + panes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 256 colors + true colour
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc"

# Mouse on, scrollback large
set -g mouse on
set -g history-limit 100000

# Faster ESC (for vim)
set -s escape-time 10

# Status bar
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left  "#[fg=cyan,bold]#S #[fg=default]| "
set -g status-right "#[fg=yellow]%Y-%m-%d %H:%M"
set -g window-status-current-style "fg=black,bg=cyan,bold"

# Splits and reload
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
